name: Build Test Artifacts

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: feat/custom-protocol-handler

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-2025
            platform: win
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install
        working-directory: package

      - name: Setup MSVC
        if: matrix.platform == 'win'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Free disk space (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            build-essential \
            cmake \
            pkg-config

      - name: Build package
        run: bun build.ts
        working-directory: package

      - name: Install kitchen dependencies
        run: bun install
        working-directory: kitchen

      - name: Build kitchen (dev)
        run: bun run build:dev
        working-directory: kitchen

      - name: Package kitchen build
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.platform }}" = "win" ]; then
            7z a artifacts/kitchen-${{ matrix.platform }}-${{ matrix.arch }}.zip kitchen/build/
          else
            tar -czf artifacts/kitchen-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C kitchen/build .
          fi

      - name: Upload kitchen artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/kitchen-${{ matrix.platform }}-${{ matrix.arch }}.*
          retention-days: 7
